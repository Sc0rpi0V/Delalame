liip_imagine:
    resolvers:
        default:
            web_path:
                web_root: '%kernel.project_dir%/public'
                cache_prefix: 'media/cache'
    filter_sets:
        gallery_thumb:
            quality: 85
            filters:
                thumbnail: { size: [400, 300], mode: outbound }
        gallery_full:
            quality: 90
            filters:
                thumbnail: { size: [1200, 900], mode: inset }
        gallery_preview:
            quality: 80
            filters:
                thumbnail: { size: [800, 600], mode: outbound }
