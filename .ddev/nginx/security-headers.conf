#ddev-silent-no-warn
# Portage de docker/nginx/default.conf (inclus dans le bloc server ddev)
client_max_body_size 12M;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# 'unsafe-eval' requis par Alpine.js (évaluation des expressions x-data/x-show/...)
# tile.openstreetmap.org requis par la carte Leaflet (page contact)
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-eval'; frame-ancestors 'self';" always;
